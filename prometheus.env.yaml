  # - url: "http://prometheus-kafka-adapter.masa-prometheus.svc.cluster.local:8080/receive"
  #- url: "http://172.21.1.74:8091/receive"
  #- url: "http://10.107.108.254:8091/receive"
  # - url: "http://10.108.193.86:3001/receive"
